name: Publish extension release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Chrome / Edge extension ZIP
        id: package
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          root = pathlib.Path('.')
          version = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))['version']
          tag = 'v' + version
          path = root / 'dist' / f'lichess-board-exporter-extension-{tag}.zip'
          path.parent.mkdir(exist_ok=True)
          names = [
              'manifest.json', 'board-core.js', 'tree-reader.js', 'monitor.js',
              'popup.html', 'popup.css', 'popup.js',
              'icons/icon16.png', 'icons/icon32.png', 'icons/icon48.png',
              'icons/icon128.png',
          ]
          with zipfile.ZipFile(path, 'w', zipfile.ZIP_DEFLATED) as zf:
              for name in names:
                  assert (root / name).is_file(), f'Missing extension file: {name}'
                  zf.write(root / name, name)
          with zipfile.ZipFile(path) as zf:
              assert 'manifest.json' in zf.namelist()
              assert json.loads(zf.read('manifest.json'))['version'] == version
              assert zf.testzip() is None
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'tag={tag}\nasset={path}\n')
          print(f'Built {path}: {path.stat().st_size} bytes')
          PY

      - name: Create GitHub Release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. No changes made."
            exit 0
          fi
          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Chess Position Exporter $TAG" \
            --notes-file "RELEASE_NOTES_${TAG}.md" \
            --latest
